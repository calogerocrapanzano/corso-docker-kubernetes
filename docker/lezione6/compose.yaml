services:
  db:
    image: mysql:8.0
    container_name: lezione6-db
    command: --innodb-use-native-aio=0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: scuola
    volumes:
      - ./mysql-data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: lezione6-adminer
    depends_on:
      - db
    ports:
      - "8080:8080"
