apiVersion: v1
kind: Pod
metadata:
  name: networkpolicy-server
  namespace: test
  labels:
    app: networkpolicy-server
spec:
  containers:
  - name: nginx
    image: nginx:stable-alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: networkpolicy-server
  namespace: test
spec:
  selector:
    app: networkpolicy-server
  ports:
  - port: 80
    targetPort: 80
