apiVersion: v1
kind: Pod
metadata:
  name: networkpolicy-client
  namespace: test
  labels:
    access: allowed
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["/bin/sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: networkpolicy-egress-client
  namespace: test
  labels:
    access: egress-test
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: networkpolicy-attacker
  namespace: test
  labels:
    access: denied
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["/bin/sh", "-c", "sleep 3600"]
