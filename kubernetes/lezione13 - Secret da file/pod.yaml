apiVersion: v1
kind: Pod
metadata:
  name: secret-box
spec:
  restartPolicy: Always
  containers:
  - name: busybox
    image: busybox
    command:
      - sleep
      - "3600"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    volumeMounts:
    - name: app-secret-volume
      mountPath: /etc/app
      readOnly: true
  volumes:
  - name: app-secret-volume
    secret:
      secretName: app-secret
